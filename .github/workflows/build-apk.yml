name: Build Kivy APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip git zip unzip openjdk-17-jdk autoconf automake cmake build-essential libssl-dev libffi-dev zlib1g-dev

      - name: Install Buildozer and fix 'sh'
        run: |
          pip install --upgrade pip
          pip install buildozer
          pip uninstall -y sh
          pip install "sh<2.0"

      - name: Setup Android SDK & Accept Licenses
        env:
          ANDROID_HOME: ~/android-sdk
          ANDROID_SDK_ROOT: ~/android-sdk
        run: |
          mkdir -p "\$ANDROID_HOME"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d "\$ANDROID_HOME"
          
          # Создаем требуемую структуру cmdline-tools/latest
          mkdir -p "\$ANDROID_HOME/cmdline-tools/latest"
          mv "$ANDROID_HOME/cmdline-tools"/* "$ANDROID_HOME/cmdline-tools/latest/"
          rmdir "\$ANDROID_HOME/cmdline-tools"
          
          # Добавляем пути в PATH для текущей сессии
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:\$PATH"
          
          # Установка компонентов и лицензий с явным указанием sdk_root
          sdkmanager --sdk_root="\$ANDROID_SDK_ROOT" --install "platforms;android-31" "build-tools;30.0.3" "ndk;25.2.9519653"
          yes | sdkmanager --sdk_root="\$ANDROID_SDK_ROOT" --licenses || true

      - name: Build APK
        env:
          ANDROID_HOME: ~/android-sdk
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-file
          path: bin/*.apk
